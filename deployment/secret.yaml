# stringData values are stored as plain text here and base64-encoded by
# `kubectl apply` automatically. Replace placeholders with real values.
# To generate a self-signed cert for the TLS secret:
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout tls.key -out tls.crt -subj "/CN=nginx.example.com"

---
apiVersion: v1
kind: Secret
metadata:
  name: nginx-basic-auth
  labels:
    app: nginx
type: Opaque
stringData:
  username: "admin"
  password: "change-me-please"

---
apiVersion: v1
kind: Secret
metadata:
  name: nginx-tls
  labels:
    app: nginx
type: kubernetes.io/tls # referenced by the Ingress for TLS termination
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE-WITH-YOUR-CERTIFICATE
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE-WITH-YOUR-PRIVATE-KEY
    -----END PRIVATE KEY-----

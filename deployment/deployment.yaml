apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  # NOTE: `latest` tag is fine for demos; pin a version (e.g. 1.27.0) for production.
  replicas: 5
  selector:
    matchLabels:
      app: nginx
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            # ConfigMap as environment variable
            - name: WELCOME_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: nginx-configmap
                  key: welcome-message
            # Secret as environment variable
            - name: BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nginx-basic-auth
                  key: username
                  optional: true
            - name: BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nginx-basic-auth
                  key: password
                  optional: true
          volumeMounts:
            # ConfigMap mounted as a file (overrides default site config)
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            # Secret mounted as a directory (HTTPS certs for the pod)
            - name: nginx-tls
              mountPath: /etc/nginx/certs
              readOnly: true
            # PVC mounted for web content - survives pod restarts/reschedules.
            # Starts empty, hiding the image's default welcome page; populate
            # it with e.g. `kubectl cp index.html <pod>:/usr/share/nginx/html/`
            - name: nginx-content
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-configmap
        - name: nginx-tls
          secret:
            secretName: nginx-tls
        - name: nginx-content
          persistentVolumeClaim:
            claimName: nginx-pvc
